name: publish

on:
  schedule:
    - cron: '30 * * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if no upstream release changes were detected'
        type: boolean
        default: false

jobs:
  # Builds metadata only (no dist archives) and fingerprints the resulting package versions.
  # Only run publish when something changed.
  check:
    runs-on: ubuntu-latest
    name: Detect release changes
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install satis
        run: composer create-project composer/satis:dev-main /tmp/satis --no-interaction --quiet

      - name: Build metadata without archives
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          jq 'del(.archive)' satis.json > /tmp/satis-check.json
          php /tmp/satis/bin/satis build /tmp/satis-check.json /tmp/check --no-html-output

      - name: Fingerprint package versions
        id: fingerprint
        run: |
          fingerprint=$(
            {
              sha256sum satis.json
              find /tmp/check/p2 -name '*.json' | sort | while read -r file; do
                jq -c --arg file "${file#/tmp/check/}" \
                  '[$file, [.packages[][] | [.version, (.source.reference // .dist.reference // .dist.shasum // "")]]]' "$file"
              done
            } | sha256sum | cut -d' ' -f1
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Fingerprint: $fingerprint"

      - name: Compare with last published fingerprint
        id: compare
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PUBLIC_MIRROR_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PUBLIC_MIRROR_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_PUBLIC_MIRROR_REGION }}
          BUCKET: ${{ secrets.AWS_PUBLIC_MIRROR_BUCKET }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          FORCE: ${{ inputs.force }}
        run: |
          published=$(aws s3 cp "s3://$BUCKET/build-fingerprint.txt" - 2>/dev/null || true)
          echo "Published fingerprint: ${published:-none}"
          if [ "$FORCE" = "true" ] || [ "$published" != "$FINGERPRINT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected, publishing"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes, skipping publish"
          fi

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    name: Satis S3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run satis-s3-action
        uses: scottcharlesworth/satis-s3-action@bf64ea46d9f9ecaadee60ca2c40108637c1f1e09 # v2.0.0
        with:
          s3_bucket: ${{ secrets.AWS_PUBLIC_MIRROR_BUCKET }}
          purge: false
          debug: false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PUBLIC_MIRROR_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PUBLIC_MIRROR_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_PUBLIC_MIRROR_REGION }}
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@6adb1f613f4102ad81cd08a7ba83b8abe490cb8d # v2.4.2
        env:
          DISTRIBUTION: ${{ secrets.AWS_PUBLIC_MIRROR_CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: "/ /index.html /packages.json /p2/*"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PUBLIC_MIRROR_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PUBLIC_MIRROR_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_PUBLIC_MIRROR_REGION }}

      # Written after the satis-s3-action sync, as its `sync --delete` would otherwise remove it
      - name: Store published fingerprint
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PUBLIC_MIRROR_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PUBLIC_MIRROR_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_PUBLIC_MIRROR_REGION }}
          BUCKET: ${{ secrets.AWS_PUBLIC_MIRROR_BUCKET }}
          FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
        run: echo -n "$FINGERPRINT" | aws s3 cp - "s3://$BUCKET/build-fingerprint.txt" --content-type text/plain
  keepalive-job:
    name: Keepalive Workflow
    if: github.event_name == 'schedule' && github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
